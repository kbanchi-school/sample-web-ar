<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebAR Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>

    <!-- スマホのカメラ映像 -->
    <video id="camera" autoplay playsinline muted></video>

    <!-- 3D -->
    <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        background="transparent: true">

        <a-assets>
            <a-asset-item id="duck" src="./models/Duck.glb">
            </a-asset-item>
        </a-assets>

        <!-- ライト -->
        <a-light type="ambient" intensity="1.5">
        </a-light>

        <a-light type="directional" intensity="1" position="1 2 1">
        </a-light>

        <!-- Duck -->
        <a-entity gltf-model="#duck" position="0 -0.5 -3" rotation="0 180 0" scale="0.01 0.01 0.01">
        </a-entity>

        <!-- カメラ -->
        <a-camera position="0 0 0" look-controls="enabled: false">
        </a-camera>

    </a-scene>


    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },
                    audio: false
                });

                const video = document.getElementById("camera");
                video.srcObject = stream;

            } catch (error) {
                console.error("Camera error:", error);
                alert("カメラを起動できませんでした。");
            }
        }

        startCamera();
    </script>

</body>

</html>
